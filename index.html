<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تكوين | Takween</title>

  <!-- Meta tags for SEO & Social Media -->
  <meta name="description"
    content="تكوين - حلول الطباعة ثلاثية الأبعاد والتصميم المبتكر. تواصل معنا واكتشف كتالوج منتجاتنا.">
  <meta property="og:title" content="تكوين | Takween">
  <meta property="og:description"
    content="حلول الطباعة ثلاثية الأبعاد والتصميم المبتكر. تواصل معنا واكتشف كتالوج منتجاتنا.">
  <meta property="og:image" content="assets/logo.svg">
  <meta name="theme-color" content="#002c74">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Thmanyah Sans - Self-hosted local font -->
  <link rel="preload" href="assets/fonts/thmanyah-sans/thmanyah-sans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/thmanyah-sans/thmanyah-sans-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/thmanyah-sans/thmanyah-sans-Black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/thmanyah-sans.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Pure Vector Watermark Background (Top-Right and Bottom-Left matching brand card) -->
  <svg class="vector-bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Single Takween Geometric Icon Symbol -->
      <symbol id="takweenSymbol" viewBox="0 0 70 70">
        <path transform="translate(-141, -39)" fill="#ffffff"
          d="M207.8,68.6l-26.3-26.3c-2.9-2.9-7.6-2.9-10.4,0l-26.3,26.3c-2.9,2.9-2.9,7.5,0,10.4l26.3,26.3c2.9,2.9,7.5,2.9,10.4,0l26.3-26.3c2.9-2.9,2.9-7.5,0-10.4ZM190.5,85.4l-10.3,10.3c-2.2,2.2-5.7,2.2-7.9,0l-17.9-17.9c-2.2-2.2-2.2-5.7,0-7.9l10.3-10.3c1-1,2.7-1,3.8,0l2.9,2.8c1,1,1,2.7,0,3.8l-5.8,5.8c-1,1-1,2.7,0,3.8l8.9,8.9c1,1,2.7,1,3.8,0l5.8-5.8c1-1,2.7-1,3.8,0l2.8,2.8c1,1,1,2.7,0,3.8ZM200.2,75.7l-2.9,2.8c-1,1-2.7,1-3.8,0l-5.9-5.9c-1-1-2.7-1-3.8,0l-5.8,5.8c-1,1-2.7,1-3.8,0l-2.7-2.7c-1-1-1-2.7,0-3.8l5.8-5.8c1-1,1-2.7,0-3.8l-6-5.9c-1-1-1-2.7,0-3.8l2.8-2.8c1-1,2.7-1,3.8,0l22.1,22.1c1,1,1,2.7,0,3.8Z" />
      </symbol>

      <!-- Infinite Vector Grid Pattern (80px cell, 58px icon, 11px padding) -->
      <pattern id="gridPattern" width="80" height="80" patternUnits="userSpaceOnUse">
        <use href="#takweenSymbol" x="11" y="11" width="58" height="58" />
      </pattern>

      <!-- Gradient Mask: Top-Right Corner fading diagonally towards center -->
      <linearGradient id="gradTR" x1="100%" y1="0%" x2="52%" y2="48%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
        <stop offset="35%" stop-color="#ffffff" stop-opacity="0.10" />
        <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      </linearGradient>

      <!-- Gradient Mask: Bottom-Left Corner fading diagonally towards center -->
      <linearGradient id="gradBL" x1="0%" y1="100%" x2="48%" y2="52%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
        <stop offset="35%" stop-color="#ffffff" stop-opacity="0.10" />
        <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      </linearGradient>

      <mask id="maskTR">
        <rect width="100%" height="100%" fill="url(#gradTR)" />
      </mask>

      <mask id="maskBL">
        <rect width="100%" height="100%" fill="url(#gradBL)" />
      </mask>
    </defs>

    <!-- Top-Right Corner Vector Watermark -->
    <rect width="100%" height="100%" fill="url(#gridPattern)" mask="url(#maskTR)" />
    <!-- Bottom-Left Corner Vector Watermark -->
    <rect width="100%" height="100%" fill="url(#gridPattern)" mask="url(#maskBL)" />
  </svg>

  <!-- Main Container -->
  <main class="page-wrapper">
    <div class="card-container">

      <!-- Top Action Bar (Share) -->
      <header class="top-nav">
        <button id="shareBtn" class="action-pill-btn" aria-label="مشاركة الصفحة" title="مشاركة الصفحة">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>مشاركة</span>
        </button>
      </header>

      <!-- Brand Profile Section -->
      <section class="brand-section" id="brandSection">
        <h1 class="sr-only" id="brandTitle">تكوين | Takween</h1>
        <img src="assets/logo.svg" alt="شعار تكوين Takween" class="brand-logo" id="brandLogo" />
        <div class="brand-slogan-badge">
          <span id="brandSlogan">هديتك... على طريقتك</span>
        </div>
        <p class="brand-description" id="brandDescription">شكرًا لثقتك واختيارك لينا — سعداء إننا كنا جزء من اختيارك</p>
      </section>

      <!-- Featured Action (Catalog) -->
      <section class="featured-section" id="featuredSection">
        <!-- Rendered dynamically by script.js -->
        <div class="skeleton skeleton-featured"></div>
      </section>

      <!-- Section Divider -->
      <div class="section-heading">
        <span class="heading-line"></span>
        <span class="heading-text">قنوات التواصل المباشر</span>
        <span class="heading-line"></span>
      </div>

      <!-- Links & Contacts List -->
      <section class="links-section" id="linksContainer">
        <!-- Rendered dynamically by script.js -->
        <div class="skeleton skeleton-link"></div>
        <div class="skeleton skeleton-link"></div>
      </section>

      <!-- Quick Social Icons Row -->
      <section class="social-row" id="socialRow">
        <!-- Rendered dynamically by script.js -->
      </section>

      <!-- Footer -->
      <footer class="page-footer">
        <p id="copyrightText">جميع الحقوق محفوظة © تكوين Takween</p>
      </footer>

    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast" role="alert" aria-live="polite">
    <span class="toast-icon">✓</span>
    <span class="toast-message" id="toastMessage">تم نسخ الرابط بنجاح!</span>
  </div>

  <!-- Share Modal / Dialog -->
  <dialog id="shareModal" class="modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>مشاركة رابط تكوين</h3>
        <button id="closeModalBtn" class="close-btn" aria-label="إغلاق">&times;</button>
      </div>
      <p class="modal-description">انسخ الرابط أو شاركه مباشرة عبر تطبيقات التواصل:</p>

      <div class="copy-url-group">
        <input type="text" id="shareUrlInput" readonly dir="ltr" />
        <button id="copyUrlBtn" class="copy-btn">نسخ الرابط</button>
      </div>

      <div class="modal-socials" id="modalSocials">
        <!-- Social share options -->
      </div>
    </div>
  </dialog>

  <!-- JavaScript -->
  <script src="js/script.js"></script>
</body>

</html>
