<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1400" preserveAspectRatio="none">
  <defs>
    <!-- Single Takween Geometric Icon Symbol -->
    <symbol id="takweenSymbol" viewBox="0 0 70 70">
      <path transform="translate(-141, -39)" fill="#ffffff" d="M207.8,68.6l-26.3-26.3c-2.9-2.9-7.6-2.9-10.4,0l-26.3,26.3c-2.9,2.9-2.9,7.5,0,10.4l26.3,26.3c2.9,2.9,7.5,2.9,10.4,0l26.3-26.3c2.9-2.9,2.9-7.5,0-10.4ZM190.5,85.4l-10.3,10.3c-2.2,2.2-5.7,2.2-7.9,0l-17.9-17.9c-2.2-2.2-2.2-5.7,0-7.9l10.3-10.3c1-1,2.7-1,3.8,0l2.9,2.8c1,1,1,2.7,0,3.8l-5.8,5.8c-1,1-1,2.7,0,3.8l8.9,8.9c1,1,2.7,1,3.8,0l5.8-5.8c1-1,2.7-1,3.8,0l2.8,2.8c1,1,1,2.7,0,3.8ZM200.2,75.7l-2.9,2.8c-1,1-2.7,1-3.8,0l-5.9-5.9c-1-1-2.7-1-3.8,0l-5.8,5.8c-1,1-2.7,1-3.8,0l-2.7-2.7c-1-1-1-2.7,0-3.8l5.8-5.8c1-1,1-2.7,0-3.8l-6-5.9c-1-1-1-2.7,0-3.8l2.8-2.8c1-1,2.7-1,3.8,0l22.1,22.1c1,1,1,2.7,0,3.8Z" />
    </symbol>

    <!-- Infinite Vector Grid Pattern (80px cell, 58px icon, 11px padding) -->
    <pattern id="gridPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <use href="#takweenSymbol" x="11" y="11" width="58" height="58" />
    </pattern>

    <!-- Gradient Mask: Top-Right Corner fading diagonally towards center -->
    <linearGradient id="gradTR" x1="100%" y1="0%" x2="52%" y2="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Gradient Mask: Bottom-Left Corner fading diagonally towards center -->
    <linearGradient id="gradBL" x1="0%" y1="100%" x2="48%" y2="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <mask id="maskTR">
      <rect width="100%" height="100%" fill="url(#gradTR)" />
    </mask>

    <mask id="maskBL">
      <rect width="100%" height="100%" fill="url(#gradBL)" />
    </mask>
  </defs>

  <!-- Background Base Blue (Identity color #1c4488) -->
  <rect width="100%" height="100%" fill="#1c4488" />

  <!-- Top-Right Corner Vector Watermark -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" mask="url(#maskTR)" />

  <!-- Bottom-Left Corner Vector Watermark -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" mask="url(#maskBL)" />
</svg>
